# c6 = c5 agent + recon gating by detection recency (half-life 15 frames ~= 0.5s at 30 Hz).
# soccer agent with the MCWAMPEnc actor. The actor consumes the measurable obs
# (frame + history) of mcwamp_t1_soccer_enc_env.yaml; the encoder compresses
# the history into a 64-d latent and the decoder reconstructs the true ball
# state as a joint auxiliary loss (coef 1, paper Fig. 4B). Trained FROM
# SCRATCH: measurable obs share no layout with the full-state checkpoints.
agent_name: "MCWAMPEnc"

model:
  actor_net: "fc_2layers_1024units"
  actor_init_output_scale: 0.01
  actor_std_type: "FIXED"
  action_std: 0.05

  # encoder: flat history (H frames) -> latent; decoder: latent -> true ball
  # state (position + velocity, heading frame)
  enc_net: "fc_2layers_256units"
  enc_latent_dim: 64
  dec_net: "fc_2layers_256units"

  critic_net: "fc_2layers_1024units"

  disc_net: "fc_2layers_1024units"

# joint reconstruction loss weight (paper: trained together, coef 1)
enc_recon_weight: 1.0

actor_optimizer:
    type: "Adam"
    learning_rate: 1e-4

critic_optimizer:
    type: "Adam"
    learning_rate: 1e-4

disc_optimizer:
    type: "SGD"
    learning_rate: 1e-4
    weight_decay: 0.0001

# KL-adaptive lr (paper Table 1, rsl_rl convention).
desired_kl: 0.01
lr_min: 1e-6
lr_max: 1e-2

# mirror symmetry loss (paper Table 1); the measurable obs mirror is the
# per-frame map tiled over [current frame | history]
mirror_sym_weight: 1.0
log_sym_residual: true

discount: 0.99
steps_per_iter: 32
iters_per_output: 200
test_episodes: 16
normalizer_samples: 2000000
use_mixed_precision: false

actor_epochs: 5
actor_batch_size: 4
critic_epochs: 2
critic_batch_size: 2
disc_epochs: 2
disc_batch_size: 2

td_lambda: 0.95
ppo_clip_ratio: 0.2
norm_adv_clip: 4.0
action_bound_weight: 10.0
action_entropy_weight: 0.0
action_reg_weight: 0.0

critic_eval_batch_size: 4096
disc_eval_batch_size: 2048
disc_buffer_size: 50000
disc_replay_samples: 1000
disc_logit_reg: 0.01
disc_grad_penalty: 50
disc_reward_scale: 1
disc_score_scale: 0.4
disc_reward_score_scale: 0.4
disc_reward_norm: true
disc_reward_norm_alpha: 0.05

# Test-mode return mixture only (training uses per-critic advantages).
task_reward_weight: 0.5
disc_reward_weight: 0.5

# Multi-critic advantage combination: A = w_goal * norm(A_goal) + w_aux * norm(A_aux)
critic_weights: [2.0, 1.0]

# aux stream = aux_style_weight * disc_r + env aux reward (Table 3: AMP style 0.3)
aux_style_weight: 0.3

# Per-stream reward scale before TD(lambda); keeps critic targets O(1-10)
# despite Table 3's raw weights (goal progress 500, termination -1000).
critic_reward_scales: [0.01, 0.01]
enc_recon_gate_halflife: 15.0 # c6: hidden-ball recon targets decay; never-seen -> 0
