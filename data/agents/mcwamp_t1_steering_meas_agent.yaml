# Booster T1 steering, measurable observation (paper Table 3).
# Identical to mcwamp_t1_steering_agent.yaml except for what the encoder-decoder
# requires: same optimizers, same KL-adaptive lr, same multi-critic weights, and
# the mirror loss left OFF exactly as in the baseline, so the paired runs differ
# in the observation alone. Turning mirror_sym_weight on is a separate
# experiment (the measurable mirror map is registered and unit-tested already).
agent_name: "MCWAMPRecon"

model:
  actor_net: "fc_2layers_1024units"
  actor_init_output_scale: 0.01
  actor_std_type: "FIXED"
  action_std: 0.05

  # encoder over the flattened history, decoder back to the privileged target
  enc_net: "fc_2layers_256units"
  enc_latent_dim: 64
  dec_net: "fc_2layers_256units"

  critic_net: "fc_2layers_1024units"

  disc_net: "fc_2layers_1024units"

# Reconstruction loss weight. The paper trains the decoder jointly at coef 1,
# but its target is the ball state in metres; here the target is the base-frame
# linear velocity in m/s and the MSE is taken on the RAW target (there is no
# normalizer for it), so this is a fresh hyperparameter, not a transfer.
recon_weight: 1.0

actor_optimizer:
    type: "Adam"
    learning_rate: 1e-4

critic_optimizer:
    type: "Adam"
    learning_rate: 1e-4

disc_optimizer:
    type: "SGD"
    learning_rate: 1e-4
    weight_decay: 0.0001

# KL-adaptive lr (paper Table 1, rsl_rl convention).
desired_kl: 0.01
lr_min: 1e-6
lr_max: 1e-2

discount: 0.99
steps_per_iter: 32
iters_per_output: 200
test_episodes: 16
normalizer_samples: 2000000
use_mixed_precision: false

actor_epochs: 5
actor_batch_size: 4
critic_epochs: 2
critic_batch_size: 2
disc_epochs: 2
disc_batch_size: 2

td_lambda: 0.95
ppo_clip_ratio: 0.2
norm_adv_clip: 4.0
action_bound_weight: 10.0
action_entropy_weight: 0.0
action_reg_weight: 0.0

critic_eval_batch_size: 4096
disc_eval_batch_size: 2048
disc_buffer_size: 50000
disc_replay_samples: 1000
disc_logit_reg: 0.01
disc_grad_penalty: 50
disc_reward_scale: 1
disc_score_scale: 0.4
disc_reward_score_scale: 0.4
disc_reward_norm: true
disc_reward_norm_alpha: 0.05

# Test-mode return mixture only (training uses per-critic advantages).
task_reward_weight: 0.5
disc_reward_weight: 0.5

# Multi-critic advantage combination: A = w_goal * norm(A_goal) + w_aux * norm(A_aux)
critic_weights: [2.0, 1.0]
