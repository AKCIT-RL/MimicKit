# Booster T1 + kicks (kick01-14, ~25% of weight) - omnidirectional walking from ACCAD Male2 (forward, backward,
# turns, side-steps), the paper's walking categories (arXiv:2511.03996 sec 4.4).
# No running, no stand clip. Retargeted with scripts/retarget_accad_to_t1.py,
# ground-clamped to 2 cm. Weight = clip duration in seconds, so clips are drawn
# in proportion to their frames (B3 is a 1.02 s WRAP cycle of a 4.42 s capture
# and keeps the capture's weight). Everything else is CLAMP.
