# Booster T1: locomocao + transicoes, SEM o clipe estatico de stand.
# Ablacao do dataset_t1_locomotion_trans2.yaml: unica diferenca e a remocao de
# t1_stand.pkl. Walk/run mantem os pesos; as transicoes usam CLAMP porque nao
# sao ciclicas (seam medida 6.8-9.9 sem aparar, contra 0.98 do walk).
motions:
  - file: "data/motions/t1/t1_walk.pkl"
    weight: 2.0
  - file: "data/motions/t1/t1_run.pkl"
    weight: 1.0
  - file: "data/motions/t1/t1_stand_to_walk.pkl"
    weight: 1.0
  - file: "data/motions/t1/t1_walk_to_run.pkl"
    weight: 1.0
