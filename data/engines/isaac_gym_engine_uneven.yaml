engine_name: "isaac_gym"
    
control_mode: "pos"
control_freq: 30
sim_freq: 120
env_spacing: 0 # trimesh ground: nonzero env origins break GPU broadphase vs global mesh
    
ground_contact_height: 0.3
# slightly uneven terrain (paper sec 4.2). The soccer env injects
# ground.extent from its field grid; spawns are raised by random_height.
ground:
  type: "uneven"
  random_height: 0.02 # m (bump amplitude, uniform)
  horizontal_scale: 0.5 # m (bump spacing)
  border: 5.0 # m of mesh beyond the field grid
  static_friction: 1.0
  dynamic_friction: 1.0
  restitution: 0.0
