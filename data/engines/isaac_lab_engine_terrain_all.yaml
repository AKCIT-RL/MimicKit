# k72T terrain ("all-in"): the B mixture with the D generator as its top level. Round-robin on the env index, 1/4 each:
# +-1 mm | +-5 mm | +-2 cm (bumps 0.5 m apart) | +-5 cm bumps 0.25 m apart + step patches +-1-2 cm
# (isaac_lab_engine_terrain_booster.yaml). Friction 1.0. The soccer env lifts each field's spawns by its own tile bound.
engine_name: "isaac_lab"

control_mode: "pos"
control_freq: 30
sim_freq: 120
env_spacing: 0 # one global ground; the env spreads fields itself (as in the Isaac Gym twin)

ground:
  type: "uneven"
  random_height: 0.02 # m (base; each level below overrides it)
  horizontal_scale: 0.5 # m (bump spacing)
  tile_levels:
  - {random_height: 0.001}
  - {random_height: 0.005}
  - {random_height: 0.02}
  - {random_height: 0.05, horizontal_scale: 0.25, step_height_range: [0.01, 0.02], step_size: [1.0, 2.0], step_density: 0.2}
  static_friction: 1.0
  dynamic_friction: 1.0
  restitution: 0.0
