# kps7v (exp power/kps7v, 2026-11-27): pdx + envelope de motor realista. Limite de velocidade de junta do URDF do T1
# (resources/T1/T1_locomotion.urdf, htwk-gym/Booster), torque cheio ate metade do limite e queda linear a 0 no limite
# (pd_explicit_sat_ratio 2). Unica diferenca em relacao ao terrain_all_pdx.
# PD EXPLICITO (2026-11-16, exp deploy/n3fx): identico a isaac_lab_engine_terrain_all.yaml, unica diferenca control_mode (deploy MuJoCo aplica PD explicito; memo Lucas)
# k72T terrain ("all-in"): the B mixture with the D generator as its top level. Round-robin on the env index, 1/4 each:
# +-1 mm | +-5 mm | +-2 cm (bumps 0.5 m apart) | +-5 cm bumps 0.25 m apart + step patches +-1-2 cm
# (isaac_lab_engine_terrain_booster.yaml). Friction 1.0. The soccer env lifts each field's spawns by its own tile bound.
engine_name: "isaac_lab"

control_mode: "pd_explicit"

# Explicit PD gains per joint {regex: [kp, kd, effort_limit N.m]}: the deploy MJCF data/assets/t1_deploy/t1.xml
# (stiffness, damping, actuatorfrcrange), the same values the implicit drive reads from the USD in "pos"
pd_explicit_gains:
  "aahead_.*": [4.0, 0.2548, 7.0]
  ".*_shoulder_.*": [4.0, 0.2548, 18.0]
  ".*_elbow_.*": [4.0, 0.2548, 18.0]
  "waist_yaw_joint": [80.0, 5.096, 25.0]
  ".*_hip_pitch_joint": [80.0, 5.096, 45.0]
  ".*_hip_roll_joint": [80.0, 5.096, 25.0]
  ".*_hip_yaw_joint": [80.0, 5.096, 25.0]
  ".*_knee_pitch_joint": [80.0, 5.096, 60.0]
  ".*_ankle_pitch_joint": [30.0, 1.911, 24.0]
  ".*_ankle_roll_joint": [30.0, 1.911, 15.0]
pd_explicit_vel_limits:
  "aahead_.*": 12.56
  ".*_shoulder_.*": 18.84
  ".*_elbow_.*": 18.84
  "waist_yaw_joint": 10.88
  ".*_hip_pitch_joint": 12.5
  ".*_hip_roll_joint": 10.9
  ".*_hip_yaw_joint": 10.9
  ".*_knee_pitch_joint": 11.7
  ".*_ankle_pitch_joint": 18.8
  ".*_ankle_roll_joint": 12.4
pd_explicit_sat_ratio: 2.0
control_freq: 30
sim_freq: 120
env_spacing: 0 # one global ground; the env spreads fields itself (as in the Isaac Gym twin)

ground:
  type: "uneven"
  random_height: 0.02 # m (base; each level below overrides it)
  horizontal_scale: 0.5 # m (bump spacing)
  tile_levels:
  - {random_height: 0.001}
  - {random_height: 0.005}
  - {random_height: 0.02}
  - {random_height: 0.05, horizontal_scale: 0.25, step_height_range: [0.01, 0.02], step_size: [1.0, 2.0], step_density: 0.2}
  static_friction: 1.0
  dynamic_friction: 1.0
  restitution: 0.0
