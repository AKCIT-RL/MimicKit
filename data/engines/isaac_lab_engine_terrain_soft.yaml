# k72T2 terrain (softer than isaac_lab_engine_terrain_all.yaml): no +-2 cm and no +-5 cm levels, steps halved.
# Round-robin on the env index, 1/3 each: +-1 mm | +-5 mm | +-5 mm bumps 0.25 m apart + step patches +-0.5-1 cm
# (rectangles 1-2 m, 0.2 per m^2). Friction 1.0. The soccer env lifts each field's spawns by its own tile bound.
engine_name: "isaac_lab"

control_mode: "pos"
control_freq: 30
sim_freq: 120
env_spacing: 0 # one global ground; the env spreads fields itself (as in the Isaac Gym twin)

ground:
  type: "uneven"
  random_height: 0.005 # m (base; each level below overrides it)
  horizontal_scale: 0.5 # m (bump spacing)
  tile_levels:
  - {random_height: 0.001}
  - {random_height: 0.005}
  - {random_height: 0.005, horizontal_scale: 0.25, step_height_range: [0.005, 0.01], step_size: [1.0, 2.0], step_density: 0.2}
  static_friction: 1.0
  dynamic_friction: 1.0
  restitution: 0.0
