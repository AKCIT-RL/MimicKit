# k60 = ONE continuous from-scratch run; every stage of the manual chain (k5 -> k6 -> k17a -> k21c -> k23a -> k27a -> paper items)
# opens by itself when the previous stage meets its gate (GateClock; gates in the approved table, hold 5 iters, >=64 episodes).
# clock stalls at each gate 'at' (10M steps) until the metrics pass; switches start at at+1:
#  stage 0 kick-only (kick weight 1.0 on the combined dataset), 8 s, ball 0.35-0.6, perfect perception, no DR (as k5)
#  stage 1 (G0) dataset ramps to its own weights, ball 0.5-2.0 ahead, 15 s       | stage 2 (G1) ball anywhere/behind, stand starts, chase/align
#  stage 3 (G2) realistic virtual perception | stage 4 (G3) DR Table 2 (motors + static props) + pushes + ball mass 0.4-0.45
#  stage 5 (G4) stagnation -100 | stage 6 (G5) ball perturbation, goal odometry error, 60 s episodes
# Table 3 flags (critic/recon/disc) stay OFF: k27a, the reference, does not use them; one change vs the validated chain.
# GATES are on the TRAINING metrics (Train_Kicked_Ep_Frac / Ep_Fall_Rate / Ep_Goal_Rate), calibrated to ~85-90% of what each accepted
# chain checkpoint showed in its own training log (j .35/.13, k6 .26/.09, k17a .5/.05, k21c .26/.03, k23a .26/.07, k27a .29/.066, goal .09-.14).
# Eval numbers (j 99.6%, k27a 76%/27%) are NOT comparable: training episodes reset mid-motion and count ball-out ends as failures.
# Try 1 (gates at the eval values, chute>=70%) was stopped at 13M: unreachable on the training metric; stage 0 from zero tracks the original k1 (slow).
