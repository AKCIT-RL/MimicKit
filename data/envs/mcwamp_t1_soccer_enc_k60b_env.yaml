# k60b = RESUME of k60 (from-zero run stopped at ~226M samples in stage 2): the gate-2 fall threshold 0.07 was unreachable on the training
# metric (plateau 0.09-0.15 for 40M samples, return flat ~4250). Validation-only: gate 2 relaxed to kick>=0.33 / fall<=0.14; clock starts at 30M
# (stages 0-2 already open, via curriculum_sample_offset) and the earlier gates are dropped. Gates 3-5 keep the kick/goal thresholds of k60 but fall<=0.15 (the 0.06-0.09 values sit below the training-metric floor seen in stage 2).
