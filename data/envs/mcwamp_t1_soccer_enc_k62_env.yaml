# k62 = k61 with gates 3-4 set to what the training metric reaches under DR (k61 plateaued at fall 0.19-0.24 for 40M samples with gate 3 at 0.15;
# k61b then opened both at fall 0.145-0.17 after ~25M more samples). Gate 3 fall<=0.24, gate 4 fall<=0.22. Perception and goal odometry are OUT (other team's scope):
# ball/goal positions are privileged, the percep curriculum never starts, goal_odom_noise is off. virtual_perception stays true ONLY to keep the obs layout.
# k61 = k60 without vision/odometry (that scope is another team's): ball and goal positions are privileged (percep curriculum never starts -> p=0,
# 360 deg, no latency/noise; no goal odometry error). Everything else as k60: ONE continuous from-scratch run, stages open by GateClock.
#  stage 0 kick-only, 8 s, ball 0.35-0.6, no DR | stage 1 (G0) dataset ramps to its own weights, ball 0.5-2.0, 15 s | stage 2 (G1) ball anywhere/behind, stand starts, chase/align
#  stage 3 (G2) DR Table 2 + pushes + ball mass 0.4-0.45 | stage 4 (G3) stagnation -100 | stage 5 (G4) ball perturbation, 60 s episodes
# Gates on TRAINING metrics (see k60 header for calibration); falls relaxed after k60/k60b showed the train-metric floor (docs/t1/21). Table 3 flags stay OFF.
