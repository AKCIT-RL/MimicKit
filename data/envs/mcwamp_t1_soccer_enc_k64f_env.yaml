# k64f = k64e + kick_overspeed_goal_exempt 2.5, RESUME of k64e. Cause (grid cells x>=5.5 |y|<=1 stay 0% even with 15% of the spawns there): near the goal a normal kick (gain ~13 m/s) pays -50*9.5 overspeed but the ball crosses in 1-3 steps and the goal step zeroes the shaping, so kicking is a net loss and the policy parks 0.8 m from the ball. Probes (6.0/6.2/6.4, 0) and (6.5, 0.5) all 0%.
# k64e = k64b (wide strip, prob 0.15, all y, x>=4.8) + a central core (prob 0.15, x in [5.6, 6.6], |y|<=1.5), from k63b. k64d (strip concentrated on the goal line) regressed: total 70.8%, behind 58.8%, oob 23.7%, (5.5,0) 3%.
# k64d = k64c with the strip x concentrated next to the goal line (pow 2: 47% of the strip beyond x=6.2) and prob 0.25. k64c fixed (5.5, |y|<=1) 0->100% but (6.5, |y|<=1) stayed 0% (trace: robot parks 0.8 m from the ball, goal 1.3 m away) and lost total success 80.6->77.9, behind 81.7->73.4.
# k64c = k64b with the strip narrowed to the central corridor |y|<=1.5 (trace of k64b at (5.5,0): robot parks 0.73 m from the ball with ball and goal collinear and the goal 2.2 m away; |y|>=2 cells already work), prob 0.3.
# k64b = RESUME of k63b (final) like k64a (ball_spawn_margin 0.4) plus a targeted sampler: 20% of the ball spawns land in the strip next to the goal line
# (field-local x in [4.8, 6.6], any y). k64a (widened range only) did NOT fix the cells glued to the goal (grid x>=5: 41%, fall 5%): the robot still stops ~0.75 m
# from the ball when the ball is <1.5 m from the goal line, so those states need real training mass. Everything else = k64a.
# k64a = RESUME of k63b (final) with the ball spawn range widened to the Fig. 4A grid: ball_spawn_margin 0.4 (x up to 6.6, y up to 4.1) instead of
# the robot's spawn_margin 1.0 (x up to 6.0, y up to 3.5). Diagnosis (docs/t1/22): in the grid the cells x=6.5 (|y|<=2) and (5.5, 0) end 100% timeout with
# the robot stopping 0.7-0.8 m from the ball, and |y|=4 / (6.5, |y|>=3) end 70-90% ball-out: those balls were never spawned in training. Everything else = k63a.
# k63a = RESUME of the k62 checkpoint at iteration 3600 (~236M, end of stage 4, BEFORE stage 5), kept in stage 4 for good: gate 4 is unreachable
# (kicked_ep_frac >= 2), so ball perturbation and 60 s episodes never start. Tests whether the kick-rate drop of k62 after ~240M (77% -> 34-43%) is caused by stage 5.
# Clock starts at 40M (stages 0-3 open, as k61b). Everything else identical to k62.
# k62 = k61 with gates 3-4 set to what the training metric reaches under DR (k61 plateaued at fall 0.19-0.24 for 40M samples with gate 3 at 0.15;
# k61b then opened both at fall 0.145-0.17 after ~25M more samples). Gate 3 fall<=0.24, gate 4 fall<=0.22. Perception and goal odometry are OUT (other team's scope):
# ball/goal positions are privileged, the percep curriculum never starts, goal_odom_noise is off. virtual_perception stays true ONLY to keep the obs layout.
# k61 = k60 without vision/odometry (that scope is another team's): ball and goal positions are privileged (percep curriculum never starts -> p=0,
# 360 deg, no latency/noise; no goal odometry error). Everything else as k60: ONE continuous from-scratch run, stages open by GateClock.
#  stage 0 kick-only, 8 s, ball 0.35-0.6, no DR | stage 1 (G0) dataset ramps to its own weights, ball 0.5-2.0, 15 s | stage 2 (G1) ball anywhere/behind, stand starts, chase/align
#  stage 3 (G2) DR Table 2 + pushes + ball mass 0.4-0.45 | stage 4 (G3) stagnation -100 | stage 5 (G4) ball perturbation, 60 s episodes
# Gates on TRAINING metrics (see k60 header for calibration); falls relaxed after k60/k60b showed the train-metric floor (docs/t1/21). Table 3 flags stay OFF.
