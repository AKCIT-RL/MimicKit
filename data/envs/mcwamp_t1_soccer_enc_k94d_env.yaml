kick_lin_vel_std: 0.1
kick_ang_vel_std: 0.02
push_interval_s: 5.0
push_duration_s: 1.0
push_force_std: 10.0
push_torque_std: 2.0
push_impulse_scale: 0.1

# doc 25 item 4: Table 3/4 regularization calibrated by Olives (base P, e80tonn1); the global action rate -1 stays
