# k94d = k94c + nav_vel_filter_s 0.3: the nav tracking reward/err use an EMA (0.3 s) of the heading-frame velocity and yaw rate.
# k94a-c train yaw err ~1.33 from the first iteration vs ~0.29 deterministic: raw yaw rate under action noise is jitter, yaw reward ~0 (doc 25).
# k94c = k94a with the nav tracking weights x10 (lin 50.0, yaw 25.0): k94a at 30M kept nav err = |cmd| (lin 0.48, yaw 1.34) while
# the kick task reward is ~21/step vs nav ~2.7/step, so the nav share of the joint goal advantage is small (doc 25).
# k94a = k93r + velocity-command (nav) mode (doc 26, MK1): 20% of the episodes follow a (vx, vy, wz) command in
# the steering slots with the ball parked and hidden; tracking reward replaces the kick task reward there (goal stream).
# Seeded from k93r 700 after tools/prep_cmd_warmstart.py (steering slots: norm 0/1, first-layer columns zeroed).
# Nav stage 2 opens on a gate at 45M of the replayed schedule (nav err/fall): 40% nav, full command range, nav->kick
# switches 0.3 per resample. Gate 4 at 50M stays unreachable (stage 5 off, as in the k93 lineage).
# k93r = k93q + impulse reward 10 (aim_gate * min(gain, 8)^2 at a kick event: a 6 m/s one-step strike pays 360, three 2 m/s pushes 120), seeded from k93m 700; +100M (doc 25 M13).
# k93d = k93c (reward_ball_oob_w -15) seeded from k93a 600 instead of k92a 750: the aim gate is already learned there (k93a 400 goal 45 / 70%); +100M (doc 25 M13).
# k93c = k93a with the ball out-of-bounds penalty (reward_ball_oob_w -15, mirrors reward_goal_scored_w 15): k93a 400 has the side-foot kick (toe 0 / 9%) but oob 55% in front; fine-tune of k92a 750 +100M (doc 25 M13).
# k93a = k92a with the positive kick-style terms (pitch target, toe out, contact side) gated by the launch aim (kick_style_aim_mix 1.0): k92a 750 has the side-foot kick (toe 9%) but oob 98% in front; fine-tune of k92a 750 +100M (doc 25 M13).
# k92a = k89d rerun with the kick_direction reward restored (the strike-cos term had overwritten dir_r since 2026-10-19; doc 25).
# k89d = k89a with the M13 weights x10 (toe face -1000, toe out 1000): k89a/b/c at ~60M kept the toe contact at 92-98% in MuJoCo (doc 25 sec 4.2); fine-tune of k85b final (~1229M) +100M, terrain.
# k85b = k83b unchanged (control for k85a) (doc 25, onda 5): fine-tune of k83b final (~1129M) +100M, terrain.
# k83b = k81b + prev-step pitch gate (mix 1.0, sigma 15) + dense foot-pitch penalty -2500.0 (doc 25, onda 4, M13): k81e at -100 cost ~50 per toe-poke vs ~1160 of goal progress; fine-tune of k81b final (~1029M) +100M, terrain.
# k81b = k80b + arm pose on all 8 arm joints (elbows added; targets = median p10-p90 center of the dataset clips) tol 0.2 -> 0.15 (M12: k80b range 0.70, elbows 0.8/1.25) (doc 25, onda 3): fine-tune of k80b final (~929M, grid 92.5%, M11 ok, arm RMS 1.00) +100M, terrain.
# k80b = k79b + soft arm terms: arm pose -2 (tol 0.2) + arm vel -0.25 (M12; k79c at -5/-0.5 cut speed and grid) (doc 25, onda 2): fine-tune of k79b final (~829M, grid 94.8%) +100M, terrain.
# k79b = k79a + torque saturation -1000 (M7 with the M11 fix; k76d alone: sat 0.37 -> 0.19 but far speed 0.28) (doc 25, onda 1 das metas restantes): fine-tune of k78f750 (k78f iteration 750, ~729M) +100M, terrain. One change vs k78f.
# k78f: k78c + reward_kick_alignment_w 45 -> 90 (doc 25, M1), fine-tune of k78c (680M, grid 82.0%); control = k78e (same start, k78c env).
# k78c: k78b + reward_kick_alignment_w 15 -> 45 (doc 25, M1): the sharper alignment term at a weight comparable to the
# direction-blind contact reward (100 x gain, cap 2).
# k75b: d0 (control) + reward_kick_chapa_w 100 (isolates the chapa term vs d0). Side-foot score from the foot state of the step BEFORE the kick event (doc 25, M13).
# k74 (doc 25) = k73a (deploy torque t1_deploy + action delay U(0, 33.3) ms) + the e80tonn1 robustness package (items 1-7 approved
# 2026-10-16, gait terms excluded by the user): 1 running clips in the dataset + steer_speed_max 2.0 (chase cap), 2 per-foot contact DR,
# 3 Booster world kicks/pushes, 4 calibrated Table 3/4 regularization (joint limit on the action, head/leg action rate, collision),
# 5 real floor = the terrain stage k74T (mixture incl. Booster D), 6 mirror 10 and 7 recon_tar_norm (agent k74). From scratch, flat, 480M.
# New movement terms stay OFF (kick_pitch_mix 0, reward_arm_vel_w 0, reward_kick_sideways_w 0): ablations on top of k74.
# k73a (doc 25, phase 2) = k72 on the DEPLOY torque asset (data/assets/t1_deploy: T1_23DOF_CFG.effort_limit, knee 60 Nm, hip pitch 45,
# ankle pitch 24, arms 18) with the action delay widened to U(0, 33.3) ms (Olives doc 17: d33 = 1.7% falls at 30 ms vs 5.6% for 0-20 ms).
# Same recipe otherwise (stage 5 never opens, strip/core near the goal, overspeed exemption). Used from scratch (k73b) and as the base env
# of the fine-tune of k72x (k73a1). New reward terms stay OFF here (kick_pitch_mix 0, reward_arm_vel_w 0).
# k72 = k70 + the three k63/k64 lessons that made k64f (docs/t1/22), from scratch:
#  1) stage 5 (ball perturbation + 60 s episodes) never opens: gate 4 unreachable (kicked_ep_frac >= 2), as k63a..k64f.
#     In k62 that stage dropped the kick 77% -> 34-46%; kept in stage 4 the chain reached kick 98%.
#  2) ball spawns next to the goal (k64e/f): ball_spawn_margin 0.4, strip 0.15 (x >= 4.8, all y) + core 0.15
#     (x in [5.6, 6.6], |y| <= 1.5). Switched on with stage 2 (ball anywhere) via stage_params, not in the kick-only stage.
#  3) kick_overspeed_goal_exempt 2.5 (k64f): no overspeed penalty within 2.5 m of the goal, so kicking next to it pays.
# k62 = k61 with gates 3-4 set to what the training metric reaches under DR (k61 plateaued at fall 0.19-0.24 for 40M samples with gate 3 at 0.15;
# k61b then opened both at fall 0.145-0.17 after ~25M more samples). Gate 3 fall<=0.24, gate 4 fall<=0.22. Perception and goal odometry are OUT (other team's scope):
# ball/goal positions are privileged, the percep curriculum never starts, goal_odom_noise is off. virtual_perception stays true ONLY to keep the obs layout.
# k61 = k60 without vision/odometry (that scope is another team's): ball and goal positions are privileged (percep curriculum never starts -> p=0,
# 360 deg, no latency/noise; no goal odometry error). Everything else as k60: ONE continuous from-scratch run, stages open by GateClock.
#  stage 0 kick-only, 8 s, ball 0.35-0.6, no DR | stage 1 (G0) dataset ramps to its own weights, ball 0.5-2.0, 15 s | stage 2 (G1) ball anywhere/behind, stand starts, chase/align
#  stage 3 (G2) DR Table 2 + pushes + ball mass 0.4-0.45 | stage 4 (G3) stagnation -100 | stage 5 (G4) ball perturbation, 60 s episodes
# Gates on TRAINING metrics (see k60 header for calibration); falls relaxed after k60/k60b showed the train-metric floor (docs/t1/21). Table 3 flags stay OFF.
