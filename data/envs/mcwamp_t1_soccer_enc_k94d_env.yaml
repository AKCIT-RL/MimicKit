  action_delay_ms: [0.0, 33.3]
  foot_friction: [0.1, 2.0]       # doc 25 item 2: Booster per-foot contact (e80tonn1)
  foot_compliance: [0.5, 1.5]
  foot_restitution: [0.1, 0.9]
dr_foot_props_per_foot: true

# doc 25 item 3: Booster Gym world perturbations (e80tonn1) replace the soccer velocity pushes (char_push_enable false);
# they switch on with char_push_start_samples (stage 3, with the DR)
