# kps1m (exp power/kps1m): kps1k com kick_pow_vmax 4.5 -> 6.0 (v0 = 0,8 + 5,2 p); retomado do kps1k it3800 (1,249B).
# kps1k (exp power/kps1k): kps1i com penalidade de retoque mais forte (reward_kick_pow_retouch_w -500 -> -1000); retomado do kps1i it7604 (fim, 1,0B).
# kps1i (exp power/kps1i): kps1g com a cauda da velocidade mais forte (tail_w 0.5 -> 1.0, tail_s 2.0 -> 1.0): chute curto por 0,8 m/s passa a perder ~2,6x mais.
# kps1g (exp power/kps1g): kps1f com kick_pow_speed_dir_mult true: a recompensa de velocidade so paga na direcao certa (r_speed *= r_dir).
# kps1f it1300: pago 0,47-0,66, inclinacao ~0,92, mas mira 27-36 graus (mediana); a velocidade pagava chutando para qualquer lado.
# kps1f (exp power/kps1f): kps1e com kick_pow_dir_sigma_deg 10 -> 30. Partindo do zero, o erro de mira (~47 graus) deixa exp(-(derr/10)^2) ~ 0:
# a recompensa de direcao nao tem gradiente e so a de velocidade paga. Retomado do kps1e it1050 (relogio 50M, S6 aberto).
# kps1e (exp power/kps1e): kps1d com kick_pow_end_s 1.0 -> -1. O SUCC 1 s apos o chute pago zerava o valor futuro (estilo + tarefa) no mcwamp;
# a politica aprendeu a nao chutar (kps1c: chute 0,43 -> 0,1, toques 0,9 -> 3,5). Sem o fim, o episodio segue ate o timeout (bootstrap).
# kps1d (exp power/kps1d): kps1c com a trava G2 (30M) relaxada no terreno: ep_fall_rate <= 0,14 -> 0,24 (igual ao G3), decisao do usuario 2026-11-24.
# Retomado do kps1c (471M, clock parado em 30M). Unica variavel contra kps1c: limiar de queda da G2.
# kps1c (exp power/kps1): kps1a com fracao de potencia 0,8 (kick_tgt_prob 0,5 -> 0,8). Variavel: fracao de episodios de potencia.
# Base: kpc1 (kfjft + potencia continua p~U(0,1), vmax 4,5, mask_dir, shape_first_only, inicio tipo benchmark 0,5).
# Mudancas vs kpc1: curriculum_sample_offset 0 (travas G0-G3 e estagios do k72/k74b voltam a valer), sem filtro
# (action_filter_alpha 1,0, decisao do usuario 2026-11-23), kick_tgt_prob 0,5 (metade legado: o aluno precisa do chute a gol),
# termos da cadeia k79b..kfj em 0 no inicio e ligados por stage_params em S5 (relogio 44M) e S6 (48M), depois do chute existir.
# Motor: isaac_lab_engine_terrain_all_pdx.yaml. Agente: kps1 (k74b + action_std_schedule 0,15 -> 0,05).
# kpc1 (exp power/kpc1): continuous-power TEACHER. kpf6m env (v0 3.3 teacher) with p ~ U(0,1), vmax 4.5 (user decision 2026-11-21),
# kick_pow_shape_first_only and kick_pow_bench_start_prob 0.5 (n9b/n9d), every kick episode in power mode. Agent: kpx6 with action std 0.05
# (n9c: std 0.15 wiped the power conditioning; kpx6 with std 0.15 never conditioned on p).
# kpf6m (exp power/kpf6): kpf4m (medium teacher, v0 3.3) with kick_pow_mask_dir true only (see kpf6p).
# kpf4m (exp power/kpf4): consolidation of the fixed-power teacher at v0 3.3 m/s (p 0.532, ladder frozen: lo_start = lo_min)
# with a 2x narrower speed reward (sigma 0.15 + 0.05 v0, was 0.3 + 0.1 v0): kpf3 kept the median on target but
# |v - v0| <= 0.5 plateaued at ~0.5 (the wide gaussian pays ~full for a 0.4 m/s miss). Warm-start: kpf3 model_0000000320.
# kpf2 (exp power/kpf2): kpf1 with the ladder criterion |mean signed speed error| <= 0.2 m/s over >= 300 paid kicks
# (kick_pow_adapt_bias_tol). kpf1's 70% ok threshold is unreachable under exploration noise (std 0.15): training ok ~0.31
# while the deterministic eval gave ok 0.60 at v0 4.5 (peak 4.70). Teachers are still validated at the gate (eval ok >= 70%).
# kpf1 (exp power/kpf1): fixed-power teacher ladder. kpx6 env with EVERY episode in power mode (kick_tgt_prob 1.0, no legacy)
# and a single target speed per moment: p = lo (window 0.001, front_prob 1.0); lo starts at v0 4.5 m/s (0.787) and drops 0.03
# (~0.14 m/s) whenever >= 70% of >= 300 paid kicks are within 0.5 m/s, down to v0 1.6 m/s (0.170). Checkpoints at
# v0 ~3.5 and ~2.0 become the medium/pass teachers; the student (n8) picks among teachers by p.
# kpx5 (exp power/kpx5): kpx3 recipe (p ~ U(0,1), vmax 5.5, tail 0.5) + p also in steering slot 4 (kick_pow_p_slot4), whose
# normalizer is patched to mean 0/std 1 (tools/lab/patch_obs_norm_steer.py --roles 0,1,4 --zero_w_roles 0,1,4: first-layer weights of those slots cut, bias-compensated); slots 2,3 keep kpx2's saturated values.
# kpx2: Lucas' kfjft (kfj + Gym pd_explicit, action delay from step 0, torque-sat, joint limit on action; filter 0.5 kept) + kick power block of kpx1 (docs/t1/44, exp power/kpx2)
# kfjft (2026-11-17, Lucas): actuator/delay fine-tune of the n2k teacher kfj in Isaac Gym (pd_explicit).
# Byte-identical to the env_config.yaml saved in the kfj run (deploy/n2k_it200_insumos/teachers/kfj_env_config.yaml).
# Its clock (curriculum_sample_offset ~1229M) is past every gate/stage/switch, so DR runtime (kp/kd, bias, delay)
# and pushes are on from the first step, as in the teacher run.
