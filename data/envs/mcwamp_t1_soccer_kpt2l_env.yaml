# kpt2l (exp power/kpt2): kpt1l (kpf7l env, v0 1.4) re-centred at v0 1.25 (p 0.0957) so the DAgger student, pulled up ~+0.15 by the mid teacher, lands near 1.4 between the 1.2/1.6 gate points.
# kpf7l (exp power/kpf7): kpf6 recipe (kick_pow_mask_dir, sigma 0.15+0.05 v0, ladder frozen) at v0 1.4 m/s (p 0.1277).
# Warm-start: kpf6pc-final (pico 2,17). Gate points of eval_kick_pow_lab need teachers near 1.2/1.6, 3.0, 4.5, 5.5 m/s.
# kpf6p (exp power/kpf6): kpf4p with kick_pow_mask_dir true only. kick_direction (w 100, ~linear in ball speed) stayed on
# in power episodes and pulled the kick ~0.5 m/s above v0 (kpf4p control: err +0.34 -> +0.6); pow_dir_r already scores the aim.
# kpf4p (exp power/kpf4): consolidation of the fixed-power teacher at v0 2.2 m/s (p 0.298, ladder frozen: lo_start = lo_min)
# with a 2x narrower speed reward (sigma 0.15 + 0.05 v0, was 0.3 + 0.1 v0): kpf3 kept the median on target but
# |v - v0| <= 0.5 plateaued at ~0.5 (the wide gaussian pays ~full for a 0.4 m/s miss). Warm-start: kpf3 model_0000000820.
# kpf2 (exp power/kpf2): kpf1 with the ladder criterion |mean signed speed error| <= 0.2 m/s over >= 300 paid kicks
# (kick_pow_adapt_bias_tol). kpf1's 70% ok threshold is unreachable under exploration noise (std 0.15): training ok ~0.31
# while the deterministic eval gave ok 0.60 at v0 4.5 (peak 4.70). Teachers are still validated at the gate (eval ok >= 70%).
# kpf1 (exp power/kpf1): fixed-power teacher ladder. kpx6 env with EVERY episode in power mode (kick_tgt_prob 1.0, no legacy)
# and a single target speed per moment: p = lo (window 0.001, front_prob 1.0); lo starts at v0 4.5 m/s (0.787) and drops 0.03
# (~0.14 m/s) whenever >= 70% of >= 300 paid kicks are within 0.5 m/s, down to v0 1.6 m/s (0.170). Checkpoints at
# v0 ~3.5 and ~2.0 become the medium/pass teachers; the student (n8) picks among teachers by p.
# kpx5 (exp power/kpx5): kpx3 recipe (p ~ U(0,1), vmax 5.5, tail 0.5) + p also in steering slot 4 (kick_pow_p_slot4), whose
# normalizer is patched to mean 0/std 1 (tools/lab/patch_obs_norm_steer.py --roles 0,1,4 --zero_w_roles 0,1,4: first-layer weights of those slots cut, bias-compensated); slots 2,3 keep kpx2's saturated values.
# kpx2: Lucas' kfjft (kfj + Gym pd_explicit, action delay from step 0, torque-sat, joint limit on action; filter 0.5 kept) + kick power block of kpx1 (docs/t1/44, exp power/kpx2)
# kfjft (2026-11-17, Lucas): actuator/delay fine-tune of the n2k teacher kfj in Isaac Gym (pd_explicit).
# Byte-identical to the env_config.yaml saved in the kfj run (deploy/n2k_it200_insumos/teachers/kfj_env_config.yaml).
# Its clock (curriculum_sample_offset ~1229M) is past every gate/stage/switch, so DR runtime (kp/kd, bias, delay)
# and pushes are on from the first step, as in the teacher run.
